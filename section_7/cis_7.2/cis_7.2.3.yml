---

{{ if .Vars.ubtu22cis_rule_7_2_3 }}
  {{ if .Vars.ubtu22cis_level_1 }}
command:
  passwd_group_exist:
    title: 7.2.3 | Ensure all groups in /etc/passwd exist in /etc/group
    exec: "awk -F: 'NR==FNR{gid[$3];next} !($4 in gid){print $4}' /etc/group /etc/passwd | sort -u"
    exit-status: 0
    stdout:
    - '!/./'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 7.2.3
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
  {{ end }}
{{ end }}
