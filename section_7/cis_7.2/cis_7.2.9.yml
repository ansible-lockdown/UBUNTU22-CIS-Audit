{{ if .Vars.ubtu22cis_level_1 }}
  {{ if .Vars.ubtu22cis_rule_7_2_9 }}
command:
  home_dirs_exist:
    title: 7.2.9 | Ensure local interactive user home directories are configured | Directories exist
    exec: for i in `cat /etc/passwd | grep -Ev "halt|sync|shutdown|nfsnobody|nologin|false" | cut -d ':' -f6`; do if [ ! -d $i ]; then echo "homedir missing $i"; fi; done
    exit-status:
      or:
      - 0
      - 1
      - 2
    stdout:
    - '!/./'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 7.2.9
      NIST800-53R5: NA
  home_dirs_ownership:
    title: 7.2.9 | Ensure local interactive user home directories are configured | Directory ownership
    exec: "getent passwd | awk -F: '$3 >= 1000 && $3 <= 60000 && $1 != \"ftpd\" {print $1, $6}' | while read user dir; do [ -e \"$dir\" ] && owner=$(stat -L -c \"%U\" \"$dir\" 2>/dev/null) && [ \"$owner\" != \"$user\" ] && echo \"home dir for $user owned by $owner\"; done; true"
    exit-status: 0
    stdout:
    - '!/./'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 7.2.9
      NIST800-53R5: NA
  home_dirs_permissions:
    title: 7.2.9 | Ensure local interactive user home directories are configured | Directory permissions
    exec: "getent passwd | awk -F: '$3 >= 1000 && $3 <= 60000 {print $6}' | while read dir; do [ -d \"$dir\" ] && find \"$dir\" -maxdepth 0 -perm /027; done; true"
    exit-status: 0
    stdout:
      - '!/.*/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 7.2.9
      NIST800-53R5: CM-6
  {{ end }}
{{ end }}
