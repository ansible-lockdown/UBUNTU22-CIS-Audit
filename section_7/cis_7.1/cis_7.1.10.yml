---

{{ if .Vars.ubtu22cis_level_1 }}
  {{ if .Vars.ubtu22cis_rule_7_1_10 }}
file:
  etc_security_opasswd_perms:
    title: 7.1.10 | Ensure access to /etc/security/opasswd is configured
    path: /etc/security/opasswd
    exists:
      or:
      - true
      - false
    owner: root
    group: root
    mode:
      or:
      - "0600"
      - "0400"
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 7.1.10
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
