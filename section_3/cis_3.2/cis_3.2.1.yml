---

{{ if .Vars.ubtu22cis_level_2 }}
  {{ if .Vars.ubtu22cis_rule_3_2_1 }}
command:
  modprobe_dccp:
    title: 3.2.1 | Ensure dccp kernel module is not available | DCCP config
    exit-status: 0
    exec: 'modprobe -n -v dccp'
    stdout:
      - '/install /bin/(true|false)/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 3.2.1
      NIST800-53R5:
      - CM-7
      CCI: CCI-000381
  lsmod_dccp:
    title: 3.2.1 | Ensure dccp kernel module is not available | running dccp
    exit-status: 1
    exec: lsmod | grep -i dccp
    stdout:
    - '!/^.*/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 3.2.1
      NIST800-53R5:
      - CM-7
      CCI: CCI-000381
  {{ end }}
{{ end }}
