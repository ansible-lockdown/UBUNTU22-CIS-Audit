---

{{ if .Vars.ubtu22cis_level_1 }}
  {{ if .Vars.ubtu22cis_rule_1_6_6 }}
file:
  etc_issue_net_perms:
    title: 1.6.6 | Ensure access to /etc/issue.net is configured
    path: /etc/issue.net
    exists: true
    owner: root
    group: root
    mode:
      or:
      - '0644'
      - '0640'
      - '0600'
      - '0400'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.6.6
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
