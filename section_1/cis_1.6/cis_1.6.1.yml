---

{{ if .Vars.ubtu22cis_level_1 }}
  {{ if .Vars.ubtu22cis_rule_1_6_1 }}
file:
  etc_motd_content:
    title: 1.6.1 | Ensure /etc/motd is configured | motd file correct
    path: /etc/motd
    exists:
      or:
      - true
      - false
    contents:
    - {{ .Vars.ubtu22cis_warning_banner }}
    - '!/(\\v|\\r|\\m|\\s)/'
    - '!/\/etc\/os-release/'
    - '!/(?i)ubuntu/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.6.1
      NIST800-53R5:
      - CM-6
      - CM-1
      - CM-3
{{ if .Vars.ubtu22cis_disable_dynamic_motd }}
  disable_dyn_motd:
    title: 1.6.1 | Ensure /etc/motd is configured | stop dynamic load
    path: /etc/pam.d/sshd
    exists: true
    contents:
    - '/#\s*session\s+optional\s+pam_motd.so\s+motd=/run/motd.dynamic/'
    - '/#\s*session\s+optional\s+pam_motd.so noupdate/'
    - '!/^session\s+optional\s+pam_motd.so noupdate/'
    - '!/^session\s+optional\s+pam_motd.so\s+motd=/run/motd.dynamic/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.6.1
      NIST800-53R5:
      - CM-6
      - CM-1
      - CM-3
{{ end }}
{{ if not .Vars.ubtu22cis_disable_dynamic_motd }}
command:
  check_motd_files:
    title: 1.6.1 | Ensure /etc/motd is configured | dynamic motd files
    exec: 'grep -Eis "(\\v|\\r|\\m|\\s|$(grep ''^ID='' /etc/os-release | cut -d= -f2 | sed -e ''s/"//g''))" /etc/update-motd.d/*'
    exit-status:
      or:
      - 0
      - 1
      - 2
    stdout:
    - '!/.*/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.6.1
      NIST800-53R5:
      - CM-6
      - CM-1
      - CM-3
    {{ end }}
  {{ end }}
{{ end }}
