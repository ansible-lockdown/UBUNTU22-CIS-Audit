---

{{ if .Vars.ubtu22cis_level_1 }}
  {{ if .Vars.ubtu22cis_rule_1_2_2_1 }}
command:
  check_updates:
    title: 1.2.2.1 | Ensure updates, patches, and additional security software are installed
    exec: apt update 2>&1 | grep -q 'All packages are up to date.' && echo OK || apt --simulate upgrade | grep -q '0 upgraded, 0 newly installed' && echo OK
    exit-status: 0
    timeout: {{ .Vars.timeout_ms }}
    stdout:
    - 'OK'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.2.2.1
      NIST800-53R5: SI-2
  {{ end }}
{{ end }}
