    meta:
      server: 2
      workstation: 2
      CIS_ID: 1.1.1.6
      NIST800-53R5: CM-7
      CCI: CCI-000381
  overlay_blacklist:
    title: 1.1.1.6 | Ensure overlay kernel module is not available | blacklist
    path: /etc/modprobe.d/blacklist.conf
    exists: true
    contents:
    - '/^blacklist overlay/'
    meta:
      server: 2
      workstation: 2
      CIS_ID: 1.1.1.6
      NIST800-53R5: CM-7
      CCI: CCI-000381
    {{ end }}
