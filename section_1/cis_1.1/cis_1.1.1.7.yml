---

{{ if .Vars.ubtu22cis_level_2 }}
  {{ if not .Vars.ubtu22cis_squashfs_required }}
  {{ if .Vars.ubtu22cis_rule_1_1_1_7 }}
file:
  squashfs_disabled:
    title: 1.1.1.7 | Ensure squashfs kernel module is not available | modprobe
    path: /etc/modprobe.d/CIS.conf
    exists: true
    contents:
    - '/^install squashfs /bin/(true|false)/'
    meta:
      server: 2
      workstation: 2
      CIS_ID: 1.1.1.7
      NIST800-53R5: CM-7
      CCI: CCI-000381
  squashfs_blacklist:
    title: 1.1.1.7 | Ensure squashfs kernel module is not available | blacklist
    path: /etc/modprobe.d/blacklist.conf
    exists: true
    contents:
    - '/^blacklist squashfs/'
    meta:
      server: 2
      workstation: 2
      CIS_ID: 1.1.1.7
      NIST800-53R5: CM-7
      CCI: CCI-000381
    {{ end }}
  {{ end }}
{{ end }}
