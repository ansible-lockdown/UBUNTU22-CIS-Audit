      CIS_ID: 1.1.1.8
      NIST800-53R5: CM-7
      CCI: CCI-000381
  udf_blacklist:
    title: 1.1.1.8 | Ensure udf kernel module is not available | blacklist
    path: /etc/modprobe.d/blacklist.conf
    exists: true
    contents:
