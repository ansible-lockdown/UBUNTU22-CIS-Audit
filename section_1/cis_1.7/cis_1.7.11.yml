---

{{ if .Vars.ubtu22cis_level_2 }}
  {{ if .Vars.ubtu22cis_desktop_required }}
    {{ if .Vars.ubtu22cis_rule_1_7_11 }}
file:
  /etc/gdm/custom.conf:
    title: 1.7.11 | Ensure Xwayland is configured
    path: /etc/gdm/custom.conf
    exists: true
    contents:
      match-regexp: '!/^\[daemon\]\nWaylandEnable\s*=\s*false/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 1.7.11
    {{ end }}
  {{ end }}
{{ end }}
