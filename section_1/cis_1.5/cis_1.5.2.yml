---

{{ if .Vars.ubtu22cis_level_1 }}
  {{ if .Vars.ubtu22cis_rule_1_5_2 }}
kernel-param:
  kernel.yama.ptrace_scope:
    title: 1.5.2 | Ensure ptrace_scope is configured | sysctl_live
    value: '{{ .Vars.ubtu22cis_ptrace_scope }}'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.5.2
      NIST800-53R5: CM-6
      CCI: CCI-000366
command:
  ptrace_restrict_2:
    title: 1.5.2 | Ensure ptrace_scope is configured | sysctl_configured
    exit-status:
      or:
      - 0
      - 2
    exec: 'grep "^kernel\.yama.ptrace_scope" /etc/sysctl.conf /etc/sysctl.d/* | cut -d ":" -f2'
    stdout:
    - '/kernel.yama.ptrace_scope\s*=\s*(1|2|3)/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.5.2
      NIST800-53R5: CM-6
      CCI: CCI-000366
  {{ end }}
{{ end }}
