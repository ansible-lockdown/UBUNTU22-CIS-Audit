---

{{ if .Vars.ubtu22cis_level_1 }}
  {{ if .Vars.ubtu22cis_rule_4_1_5 }}
command:
  ufw_routed_default:
    title: 4.1.5 | Ensure ufw outgoing default is configured
    exec: ufw status verbose | awk -F',' '$1="Default"{print $3}'
    exit-status: 0
    stdout:
    - '/^\s*(deny|disabled) \(routed\)/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 4.1.5
      NIST800-53R5:
      - CM-7
      CCI: CCI-000382
  {{ end }}
{{ end }}
