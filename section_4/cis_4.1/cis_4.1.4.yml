---

{{ if .Vars.ubtu22cis_level_2 }}
  {{ if .Vars.ubtu22cis_rule_4_1_4 }}
command:
  ufw_outgoing_default:
    title: 4.1.4 | Ensure ufw outgoing default is configured
    exec: ufw status verbose | awk -F',' '$1~/Default/ {print $2}'
    exit-status: 0
    stdout:
    - '/\s*(deny|reject) \(outgoing\)/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 4.1.4
      NIST800-53R5:
      - CM-7
      CCI: CCI-000382
  {{ end }}
{{ end }}
