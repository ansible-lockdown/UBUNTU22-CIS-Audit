---

{{ if .Vars.ubtu22cis_level_2 }}
  {{ if .Vars.ubtu22cis_rule_6_2_4_6 }}
command:
  audit_conf_owner:
    title: 6.2.4.6 | Ensure audit configuration files owner is configured
    exec: find /etc/audit/ -type f \( -name '*.conf' -o -name '*.rules' \) ! -user root
    exit-status: 0
    stdout:
    - '!/./'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.4.6
      NIST800-53R5:
      - AU-3
  {{ end }}
{{ end }}
