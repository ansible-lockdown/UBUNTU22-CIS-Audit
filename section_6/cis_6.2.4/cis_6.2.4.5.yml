---

{{ if .Vars.ubtu22cis_level_2 }}
  {{ if .Vars.ubtu22cis_rule_6_2_4_5 }}
command:
  audit_conf_perms:
    title: 6.2.4.5 | Ensure audit configuration files mode is configured
    exec: find /etc/audit/ -type f \( -name '*.conf' -o -name '*.rules' \) -perm /0137
    exit-status: 0
    stdout:
    - '!/./'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.4.5
      NIST800-53R5:
      - AU-3
  {{ end }}
{{ end }}
