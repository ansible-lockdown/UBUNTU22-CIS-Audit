---

{{ if .Vars.ubtu22cis_level_2 }}
  {{ if .Vars.ubtu22cis_rule_6_2_2_1 }}
command:
  auditd_max_log_file:
    title: 6.2.2.1 | Ensure audit log storage size is configured
    exec: grep -E "^max_log_file" /etc/audit/auditd.conf
    exit-status: 0
    stdout:
    - '/max_log_file\s*=\s*[1-9][0-9]{1,2}/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.2.1
      NIST800-53R5:
      - AU-8
  {{ end }}
{{ end }}
