---

{{ if .Vars.ubtu22cis_level_1 }}
  {{ if .Vars.ubtu22cis_rule_6_1_1_1_6 }}
command:
  compress_journald_conf:
    title: 6.1.1.1.6 | Ensure journald Compress is configured
    exec: 'systemd-analyze cat-config systemd/journald.conf | grep -Pi -- ''^\h*Compress\h*='' | tail -n 1'
    exit-status: 0
    stdout:
    - '/(?i)^\s*Compress\s*=\s*yes\s*$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.1.1.1.6
      NIST800-53R5:
      - AU-4
  {{ end }}
{{ end }}
