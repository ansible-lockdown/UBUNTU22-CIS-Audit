---

{{ if .Vars.ubtu22cis_level_1 }}
  {{ if .Vars.ubtu22cis_rule_6_1_1_1_4 }}
command:
  forward_journald_disabled:
    title: 6.1.1.1.4 | Ensure journald ForwardToSyslog is disabled
    exec: 'systemd-analyze cat-config systemd/journald.conf | grep -Pi -- ''^\h*ForwardToSyslog\h*='' | tail -n 1'
    exit-status: 0
    stdout:
    - '/(?i)^\s*ForwardToSyslog\s*=\s*no\s*$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.1.1.1.4
      NIST800-53R5:
      - AU-2
      - AU-6
      - AU-7
      - AU-12
  {{ end }}
{{ end }}
