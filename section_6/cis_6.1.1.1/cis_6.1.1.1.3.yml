---

{{ if .Vars.ubtu22cis_level_1 }}
  {{ if .Vars.ubtu22cis_rule_6_1_1_1_3 }}
command:
  log_rotate_journald_conf:
    title: 6.1.1.1.3 | Ensure journald log file rotation is configured
    exec: 'systemd-analyze cat-config systemd/journald.conf | grep -Pi -- ''^\h*(SystemMaxUse|SystemKeepFree|RuntimeMaxUse|RuntimeKeepFree|MaxFileSec)\h*=\h*\S'''
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/(?i)^\s*SystemMaxUse\s*=/'
    - '/(?i)^\s*SystemKeepFree\s*=/'
    - '/(?i)^\s*RuntimeMaxUse\s*=/'
    - '/(?i)^\s*RuntimeKeepFree\s*=/'
    - '/(?i)^\s*MaxFileSec\s*=/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.1.1.1.3
      NIST800-53R5:
      - AU-2
      - AU-7
      - AU-12
  {{ end }}
{{ end }}
