---

{{ if .Vars.ubtu22cis_level_2 }}
  {{ if .Vars.ubtu22cis_rule_6_2_3_21 }}
command:
  auditd_config_match:
    title: 6.2.3.21 | Ensure the audit configuration is immutable
    exec: augenrules --check
    exit-status: 0
