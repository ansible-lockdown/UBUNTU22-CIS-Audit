---

{{ if .Vars.ubtu22cis_level_1 }}
  {{ if .Vars.ubtu22cis_config_aide }}
    {{ if .Vars.ubtu22cis_rule_6_3_2 }}
      {{ if eq .Vars.ubtu22cis_aide_scan "cron" }}
command:
  aide_cron:
    title: 6.3.2 | Ensure filesystem integrity is regularly checked | aide cron
    exec: |
      grep -Prs '^([^#\n\r]+\h+)?(\/usr\/s?bin\/|^\h*)aide(\.wrapper)?\h+([^#\n\r]+\h+)?(--(check|update)|\$AIDEARGS)\b' /etc/cron.* /etc/crontab /var/spool/cron/
    exit-status:
      or:
      - 0
      - 2
    stdout:
    - '/aide/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.3.2
      NIST800-53R5: NA
      {{ end }}
    {{ if eq .Vars.ubtu22cis_aide_scan "timer" }}
service:
  aidecheck:
    title: 6.3.2 | Ensure filesystem integrity is regularly checked | aidecheck service
    name: aidecheck.service
    enabled: true
    skip: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.3.2
      NIST800-53R5: NA
  aidecheck.timer:
    title: 6.3.2 | Ensure filesystem integrity is regularly checked | aidecheck timer
    name: aidecheck.timer
    enabled: true
    running: true
    skip: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.3.2
      NIST800-53R5: NA
      {{ end }}
    {{ end }}
  {{ end }}
{{ end }}
