---

{{ if .Vars.ubtu22cis_level_1 }}
  {{ if .Vars.ubtu22cis_rule_6_1_1_2_4 }}
    {{ if not .Vars.ubtu22cis_is_syslog_server }}
service:
  systemd-journal-remote.service:
    title: 6.1.1.2.4 | Ensure systemd-journal-remote service is not in use | service
    running: false
    # enabled: false  # managed by socket so seen as indirect although not enabled - goss issue
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.1.1.2.4
      NIST800-53R5:
      - AU-2
      - AU-7
      - AU-12
  systemd-journal-remote.socket:
    title: 6.1.1.2.4 | Ensure systemd-journal-remote service is not in use | socket
    running: false
    enabled: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.1.1.2.4
      NIST800-53R5:
      - AU-2
      - AU-7
      - AU-12
command:
  journald_remote_not_enabled:
    title: 6.1.1.2.4 | Ensure systemd-journal-remote service is not in use | not enabled
    exec: systemctl is-enabled systemd-journal-remote.socket systemd-journal-remote.service 2>/dev/null | grep '^enabled'
    exit-status: 1
    stdout:
    - '!/./'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.1.1.2.4
      NIST800-53R5:
      - AU-2
      - AU-7
      - AU-12
  journald_remote_not_active:
    title: 6.1.1.2.4 | Ensure systemd-journal-remote service is not in use | not active
    exec: systemctl is-active systemd-journal-remote.socket systemd-journal-remote.service 2>/dev/null | grep '^active'
    exit-status: 1
    stdout:
    - '!/./'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.1.1.2.4
      NIST800-53R5:
      - AU-2
      - AU-7
      - AU-12
    {{ end }}
  {{ end }}
{{ end }}
