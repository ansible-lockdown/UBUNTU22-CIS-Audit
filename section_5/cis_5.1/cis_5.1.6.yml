---

{{ if .Vars.ubtu22cis_level_1 }}
  {{ if .Vars.ubtu22cis_rule_5_1_6 }}
command:
  no_weak_ssh_ciphers:
    title: 5.1.6 | Ensure sshd Ciphers are configured | weak cipher check
    exec: sshd -T | grep -Pi -- '^ciphers\h+\"?([^#\n\r]+,)?((3des|blowfish|cast128|aes(128|192|256))-cbc|arcfour(128|256)?|rijndael-cbc@lysator\.liu\.se|chacha20-poly1305@openssh\.com)\b'
    exit-status:
      or:
      - 0
      - 1
      - 2
    stdout: ['!/./']
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.6
      NIST800-53R5:
      - SC-8
  {{ end }}
{{ end }}
