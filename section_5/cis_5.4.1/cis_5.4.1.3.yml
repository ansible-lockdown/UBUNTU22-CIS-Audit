---

{{ if .Vars.ubtu22cis_level_1 }}
  {{ if .Vars.ubtu22cis_rule_5_4_1_3 }}
file:
  login_def_PASS_WARN_AGE:
    title: 5.4.1.3 | Ensure password expiration warning days is configured | logins.def
    path: /etc/login.defs
    exists: true
    contents:
    - '/^PASS_WARN_AGE\s*{{ .Vars.ubtu22cis_pass.warn_age }}/'
    - '!/^PASS_WARN_AGE\s*[1-6]/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.4.1.3
      NIST800-53R5: NA
command:
  user_expire_warn:
    title: 5.4.1.3 | Ensure password expiration warning days is configured | user_warning
    skip: {{ not .Vars.ubtu22cis_disruption_high }}
    exec: |
      awk -F: '($2~/^\$.+\$/) {if($6 < 7) print "FAIL: " $1 " PASS_WARN_AGE: " $6}' /etc/shadow
      echo "scan_done"
    exit-status: 0
    stdout:
    - '/^scan_done$/'
    - '!/^FAIL:/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.4.1.3
      NIST800-53R5: NA
  {{ end }}
{{ end }}
