---

{{ if .Vars.ubtu22cis_level_2 }}
  {{ if .Vars.ubtu22cis_rule_5_4_1_2 }}
file:
  login_defs_PASS_MIN_DAYS:
    title: 5.4.1.2 | Ensure minimum password days is configured
    path: /etc/login.defs
    exists: true
    contents:
    - '/^PASS_MIN_DAYS\s{{ .Vars.ubtu22cis_pass.min_days }}/'
    - '/^PASS_MIN_DAYS\s([1-9]|[1-9][0-9]{2,})/'
    - '!/^PASS_MIN_DAYS\s*(-[1-9]|0)/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 5.4.1.2
      NIST800-53R5: IA-5
command:
  users_min_pw_expire:
    title: 5.4.1.2 | Ensure minimum password days is configured | user_check
    skip: {{ not .Vars.ubtu22cis_disruption_high }}
    exec: |
      awk -F: '($2~/^\$.+\$/) {if($4 < 1) print "FAIL: " $1 " PASS_MIN_DAYS: " $4}' /etc/shadow
      echo "scan_done"
    exit-status: 0
    stdout:
    - '/^scan_done$/'
    - '!/^FAIL:/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 5.4.1.2
      NIST800-53R5: IA-5
  {{ end }}
{{ end }}
